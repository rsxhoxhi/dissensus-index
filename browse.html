<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse the Index — The Dissensus Index</title>
  <meta name="description" content="Browse and search the full Dissensus Index — every tracked case of art controversy, searchable by keyword and filterable by tag.">
  <link rel="canonical" href="https://dissensusindex.com/browse.html">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="masthead">
    <div class="masthead-inner">
      <h1><a href="index.html">The Dissensus Index</a></h1>
      <span class="masthead-issue">Summer 2026 · No. 1</span>
    </div>
    <p class="masthead-tagline">A quarterly record of art controversy</p>
    <nav class="masthead-nav">
      <a href="index.html">Issue</a>
      <a href="browse.html" class="active">Browse the index</a>
      <a href="about.html">About</a>
      <a href="methodology.html">Methodology</a>
      <a href="cite.html">How to cite</a>
    </nav>
  </header>

  <section class="hero" style="padding:1.5rem 0 2rem;">
    <div class="hero-search-wrap" style="max-width:680px;">
      <svg class="hero-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="hero-search" id="browse-search" autocomplete="off"
        placeholder="Search the full index by keyword…" oninput="applyFilters()">
    </div>
  </section>

  <section class="docket">


    <div id="active-tag" class="active-tag-bar"></div>

    <p class="page-info" id="result-count" style="text-align:left;margin-bottom:0.75rem;"></p>
    <div id="browse-list"><p style="color:var(--ink-light);font-size:0.85rem;padding:1rem 0;">Loading…</p></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <footer class="colophon">
    <span>Methodology v1.0 · ← <a href="index.html" style="color:var(--teal);text-decoration:none;">Back to the issue</a></span>
    <span>dissensusindex.com/browse.html</span>
  </footer>
</div>

<script>
let allCases = [], filtered = [], currentPage = 1, activeTag = '', activeCountry = '';
const perPage = 50;

async function loadData() {
  const res = await fetch('data/cases.json');
  const data = await res.json();
  allCases = data.cases;
  // Seatbelt: tolerate array-format tags from scan slips (render as string; data fix still expected)
  allCases.forEach(c => { if (Array.isArray(c.tags)) c.tags = c.tags.join(', '); });

  // Pre-fill search from URL (handoff from homepage hero)
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q) document.getElementById('browse-search').value = q;

  // Tag filter from URL (handoff from a clicked tag)
  activeTag = params.get('tag') || '';

  // Country filter from URL (handoff from the homepage map)
  activeCountry = params.get('country') || '';

  renderActiveTag();

  applyFilters();
}

// Country normalisation — keep in sync with the `norm` map in index.html
const countryNorm = { 'USA': 'United States', 'UK': 'United Kingdom', 'West Germany': 'Germany' };
function countryCanon(name) {
  const n = String(name).trim();
  return countryNorm.hasOwnProperty(n) ? countryNorm[n] : n;
}
function countryParts(raw) {
  return String(raw || '').split(/[\/,]/)
    .map(s => s.replace(/\(.*?\)/g, '').trim())
    .filter(Boolean)
    .map(countryCanon);
}

function applyFilters() {
  const q = document.getElementById('browse-search').value.toLowerCase().trim();
  filtered = allCases.filter(c => {
    const qOk = !q ||
      c.title.toLowerCase().includes(q) ||
      c.country.toLowerCase().includes(q) ||
      c.artist.toLowerCase().includes(q) ||
      c.institution.toLowerCase().includes(q) ||
      c.tags.toLowerCase().includes(q) ||
      c.description.toLowerCase().includes(q) ||
      c.id.toLowerCase().includes(q);
    const tagOk = !activeTag ||
      (c.tags || '').split(',').map(t => t.trim()).includes(activeTag);
    const countryOk = !activeCountry ||
      countryParts(c.country).includes(countryCanon(activeCountry));
    return qOk && tagOk && countryOk;
  });
  currentPage = 1;
  render();
}

function render() {
  const start = (currentPage - 1) * perPage;
  const page = filtered.slice(start, start + perPage);
  const countEl = document.getElementById('result-count');

  countEl.textContent = filtered.length === 0 ? 'No cases match.' :
    `${filtered.length} case${filtered.length===1?'':'s'} · showing ${start+1}–${Math.min(start+perPage, filtered.length)}`;

  document.getElementById('browse-list').innerHTML = page.length === 0
    ? '<p style="color:var(--ink-light);font-size:0.85rem;padding:1rem 0;">No cases match this filter.</p>'
    : page.map(c => `
      <a class="docket-item" href="case.html?id=${encodeURIComponent(c.id)}">
        <span class="docket-id">${c.id}</span>
        <div class="docket-main">
          <div class="docket-title">${escHtml(c.title)}</div>
          <div class="docket-sub">${escHtml(c.institution || c.artist || '')}${c.country ? ' · ' + escHtml(c.country) : ''}</div>
          ${c.tags ? `<div class="docket-tags">${c.tags.split(',').map(t => { const tg = t.trim(); return `<span class="tag" data-tag="${escHtml(tg)}">${escHtml(tg)}</span>`; }).join('')}</div>` : ''}
        </div>
      </a>`).join('');

  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(filtered.length / perPage);
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let html = '';
  if (currentPage > 1) html += `<button class="page-btn" onclick="goPage(${currentPage-1})">← Prev</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 3) {
      html += `<span style="color:var(--ink-light);font-size:0.7rem;align-self:center;">…</span>`;
    }
  }
  if (currentPage < totalPages) html += `<button class="page-btn" onclick="goPage(${currentPage+1})">Next →</button>`;
  pag.innerHTML = html;
}

function goPage(n) { currentPage = n; render(); window.scrollTo(0,0); }

function renderActiveTag() {
  const el = document.getElementById('active-tag');
  if (!el) return;
  const chips = [];
  if (activeTag) chips.push(`<span class="active-tag-chip">Tag: ${escHtml(activeTag)} <button class="active-tag-x" onclick="clearTag()" aria-label="Clear tag filter">\u00d7</button></span>`);
  if (activeCountry) chips.push(`<span class="active-tag-chip">Country: ${escHtml(activeCountry)} <button class="active-tag-x" onclick="clearCountry()" aria-label="Clear country filter">\u00d7</button></span>`);
  el.innerHTML = chips.join(' ');
}

function clearCountry() {
  activeCountry = '';
  const url = new URL(window.location);
  url.searchParams.delete('country');
  history.replaceState({}, '', url);
  renderActiveTag();
  applyFilters();
}

function clearTag() {
  activeTag = '';
  const url = new URL(window.location);
  url.searchParams.delete('tag');
  history.replaceState({}, '', url);
  renderActiveTag();
  applyFilters();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('browse-list').addEventListener('click', e => {
  const chip = e.target.closest('.tag[data-tag]');
  if (chip) { e.preventDefault(); applyTag(chip.dataset.tag); }
});

function applyTag(tag) {
  activeTag = tag;
  const url = new URL(window.location);
  url.searchParams.set('tag', tag);
  history.replaceState({}, '', url);
  renderActiveTag();
  applyFilters();
  window.scrollTo(0, 0);
}

loadData();
</script>
</body>
</html>
