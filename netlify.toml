[[redirects]]
  from = "https://dissensusindex.org/*"
  to = "https://dissensusindex.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dissensusindex.com/*"
  to = "https://dissensusindex.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
